# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "72a37eb4340e3e88b759faf4bee7a591"
name = "mobile app"
application_url = "https://shopify-mobile-app-tau.vercel.app/"
embedded = true

[access_scopes]
# Admin scopes read the store during install. Unauthenticated scopes are
# delegated to the Storefront token the mobile app receives.
# Customer Account scopes are intentionally omitted.
scopes = "read_products,read_content,read_online_store_navigation,read_metaobjects,read_metaobject_definitions,unauthenticated_read_product_listings,unauthenticated_read_product_inventory,unauthenticated_write_checkouts,unauthenticated_read_checkouts,unauthenticated_read_content,unauthenticated_read_metaobjects"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://shopify-mobile-app-tau.vercel.app/api/auth" ]

[build]
automatically_update_urls_on_dev = true
