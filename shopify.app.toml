# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Default linked config = AppMint (Invictus). Named copy: shopify.app.appmint.toml

client_id = "172f39aae878f7dfb71609b3fe1ecf33"
name = "AppMint"
application_url = "https://shopify-mobile-app-tau.vercel.app/"
embedded = true

[access_scopes]
# Admin scopes: merchant studio, sync, webhooks, sales-channel publishing.
# unauthenticated_* scopes are delegated to the Storefront token the phone uses.
# Customer Account scopes are intentionally omitted.
scopes = "read_products,read_product_listings,read_content,read_files,read_online_store_navigation,read_metaobjects,read_metaobject_definitions,read_orders,read_fulfillments,read_publications,write_publications,unauthenticated_read_product_listings,unauthenticated_read_product_inventory,unauthenticated_write_checkouts,unauthenticated_read_checkouts,unauthenticated_read_content,unauthenticated_read_metaobjects"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-mobile-app-tau.vercel.app/api/auth",
]

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [
    "orders/create",
    "orders/updated",
    "orders/cancelled",
    "orders/fulfilled",
    "orders/partially_fulfilled",
    "fulfillments/create",
    "fulfillments/update",
  ]

[build]
automatically_update_urls_on_dev = true
